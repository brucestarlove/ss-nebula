<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nebula sessions notices</title>
    <!-- Round 3 of the sessions lane: the workspace's notices over the fake registry, to look at.
         Query: ?case=kept|readonly|migrated|older -->
    <script>
      try {
        var t = localStorage.getItem('nebula:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./sessions-notices.tsx"></script>
  </body>
</html>
